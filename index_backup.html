<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>健康诊室（本地备份·自包含）</title>
        <style>
/* ===== 页面固定：禁止滚动条，任何情况下不出现滚轮滚动 ===== */
html, body{
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;          /* 裁掉溢出内容，不出滚动条 */
    overscroll-behavior: none; /* 禁止回弹/链式滚动 */
}
/* ===== 以下为 box.css 完整内联副本（备份快照，改动请以主程序为准） ===== */
.wrap{
   display: flex;
   gap: 10px;
    margin-top: 30px;
   justify-content: flex-end;
   margin-right:10px;
   transform: scale(var(--fit, 1));
   transform-origin: top right;
}
.box_1{
    width:fit-content;
    height:fit-content;
    background-color: #4a9645;
display:flex;
  justify-content:center;
  align-items:center;
    font-family: '楷体';
    font-size: 20px;
    color: #fff;
}
.menu-wrap {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: fit-content;
    margin-top: calc(200px - 25vh); /* 向上移动 1/4 屏幕高度 */
    margin-left:200px;
    transform: scale(var(--fit, 1));
    transform-origin: top left;
}
.menu-btn {
    width: 250px;
    height: 70px;
    background-color: #acccb3;
    border-radius: 8px;
    color: #ffffff;
    font-family: "楷体";
    font-size: 30px;
    text-align: center;
    line-height: 50px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s ease;
}
.menu-btn:hover {
    background-color: #137c3f;
    transform: scale(1.05);
}
/* 标题：健康诊室（田字格 + 动漫卡通风） */
.game-title{
    width: 250px;
    display: grid;
    grid-template-columns: repeat(2, auto);
    justify-content: center;
    column-gap: 14px;
    row-gap: 0;
    margin-bottom: 5px;
}
.game-title span{
    font-family: "楷体";
    font-size: 96px;
    font-weight: 900;          /* 整体加粗 */
    line-height: 1.05;
    color: #1e9e50;            /* 健、康 → 绿色填充 */
    -webkit-text-stroke: 3px #fff;
    paint-order: stroke fill;  /* 描边画在填充后面，保证彩色填充完整可见 */
    text-shadow: 4px 4px 0 rgba(30, 30, 30, 0.3);
    cursor: default;
    transition: transform 0.2s ease;
    user-select: none;
}
.game-title span:nth-child(1){ transform: rotate(-10deg) translateY(3px); }
.game-title span:nth-child(2){ transform: rotate(10deg)  translateY(-3px); }
.game-title span:nth-child(3){ transform: rotate(9deg)   translateY(-2px); color: #1e6ee5; } /* 诊 → 蓝色填充 */
.game-title span:nth-child(4){ transform: rotate(-9deg)  translateY(2px); color: #1e6ee5; } /* 室 → 蓝色填充 */
.game-title span:hover{ transform: scale(1.15) rotate(0deg); }
.bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -2;
}
.mask{
    position: fixed;
    top:0;left:0;
    width:100vw;height:100vh;
    background-color: rgba(0,0,0,0.2);
    z-index: -1;
}
/* 角色选择面板 */
.role-mask{
    position: fixed;
    top:0;left:0;
    width:100vw;height:100vh;
    background-color: rgba(0,0,0,0.5);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
}
.role-panel{
    width: 680px;
    max-width: 92vw;
    max-height: 80vh;
    background-color: #f4f8f1;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
}
.role-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.role-title{
    font-family: "楷体";
    font-size: 26px;
    color: #137c3f;
    font-weight: bold;
}
.role-close{
    font-size: 28px;
    line-height: 1;
    color: #888;
    cursor: pointer;
}
.role-close:hover{ color: #333; }
.role-grid{
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    overflow-y: auto;
    padding: 4px;
}
.role-card{
    position: relative;
    background-color: #fff;
    border: 2px solid #d5e3d0;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-family: "楷体";
    font-size: 16px;
    color: #333;
    word-break: break-all;
    cursor: pointer;
    transition: all 0.2s ease;
}
.role-card:hover{
    transform: scale(1.03);
    border-color: #137c3f;
}
.role-card.selected{
    border-color: #137c3f;
    background-color: #e7f3e4;
}
.role-card.selected::after{
    content: '✓ 已选择';
    position: absolute;
    top: 6px;
    right: 6px;
    background-color: #137c3f;
    color: #fff;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
}
.role-foot{
    margin-top: 14px;
    font-family: "楷体";
    font-size: 16px;
    color: #137c3f;
    text-align: right;
}
.role-toast{
    position: fixed;
    left: 50%;
    bottom: 60px;
    transform: translateX(-50%);
    background-color: rgba(19, 124, 63, 0.92);
    color: #fff;
    font-family: "楷体";
    font-size: 18px;
    padding: 10px 26px;
    border-radius: 8px;
    z-index: 20;
    pointer-events: none;
    animation: toastFade 2s ease forwards;
}
@keyframes toastFade{
    0%   { opacity: 0; transform: translate(-50%, 10px); }
    15%  { opacity: 1; transform: translate(-50%, 0); }
    80%  { opacity: 1; }
    100% { opacity: 0; }
}
.role-card img{
    width: 100%;
    height: 110px;
    object-fit: cover;
    object-position: center top;
    border-radius: 6px;
    margin-bottom: 6px;
}
.role-cover-ph{
    width: 100%;
    height: 110px;
    border-radius: 6px;
    margin-bottom: 6px;
    background-color: #eef3ea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}
.role-new{
    border-style: dashed;
    color: #4a9645;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
}
.role-tip{
    grid-column: 1 / -1;
    text-align: center;
    color: #777;
    font-family: "楷体";
    padding: 30px 0;
}
/* 看板娘 */
.kanban-girl{
    position: fixed;
    right: 140px;
    bottom: 20px;
    width: 400px;
    height: 600px;
    object-fit: cover;
    z-index: 5;
    transform: scale(var(--fit, 1));
    transform-origin: bottom right;
}
/* 开始游戏 */
.game-actions{
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 14px;
}
.game-btn{
    width: 110px;
    height: 44px;
    border: none;
    border-radius: 8px;
    font-family: "楷体";
    font-size: 18px;
    cursor: pointer;
}
.game-btn.cancel{ background-color: #dcdcdc; color: #555; }
.game-btn.start{ background-color: #137c3f; color: #fff; }
.game-scene{
    position: fixed;
    inset: 0;
    z-index: 8;
}
.game-bg{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
}
.game-sprite-wrap{
    position: fixed;
    right: 80px;
    bottom: 0;
    width: 500px;
    height: 600px;
    overflow: hidden;
    z-index: 9;
    transform: scale(var(--fit, 1));
    transform-origin: bottom right;
}
.game-sprite{
    width: 700px;
    height: 1000px;
    object-fit: cover;
    object-position: center top;
    margin-left: -50px;
    display: block;
}
.game-dialog{
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) scale(var(--fit, 1));
    transform-origin: bottom center;
    width: min(880px, 88vw);
    min-height: 120px;
    background-color: rgba(255, 255, 255, 0.93);
    border-radius: 12px;
    padding: 14px 20px;
    box-sizing: border-box;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    z-index: 10;
}
.game-name{
    font-family: "楷体";
    font-weight: bold;
    color: #137c3f;
    font-size: 20px;
    margin-bottom: 6px;
}
.game-text{
    font-family: "楷体";
    font-size: 18px;
    color: #333;
}
.game-input-bar{
    display: flex;
    gap: 10px;
    margin-top: 12px;
}
.game-input{
    flex: 1;
    height: 40px;
    border: 1px solid #cdd8c7;
    border-radius: 8px;
    padding: 0 12px;
    font-family: "楷体";
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
    background-color: #f9fbf7;
    transition: border-color 0.2s;
}
.game-input:focus{
    border-color: #137c3f;
}
.game-send{
    height: 40px;
    padding: 0 22px;
    background-color: #137c3f;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: "楷体";
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.2s;
}
.game-send:hover{
    background-color: #0f6333;
}
.game-send:disabled{
    background-color: #9ec2a7;
    cursor: not-allowed;
}
.game-chat-history{
    max-height: 180px;
    overflow-y: auto;
    margin-top: 4px;
    padding-right: 4px;
}
.game-chat-line{
    font-family: "楷体";
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 4px;
}
.game-chat-line.user{ color: #137c3f; }
.game-chat-line.bot{ color: #333; }
.game-exit{
    position: fixed;
    top: 16px;
    right: 16px;
    background-color: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-family: "楷体";
    font-size: 16px;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 10;
    transform: scale(var(--fit, 1));
    transform-origin: top right;
}
        </style>
    </head>
    <body>
        <video class="bg-video" autoplay muted loop playsinline>
            <source src="./image/背景.mp4" type="video/mp4">
        </video>
        <div class="mask"></div>
        <div class="wrap">
                <div class="box_1">用户</div>
                 <div class="box_1">余额</div>
                  <div class="box_1">关于我们</div>
        </div>
        <div class="menu-wrap">
             <div class="game-title"><span>健</span><span>康</span><span>诊</span><span>室</span></div>
             <div class="menu-btn" id="start-btn">开始咨询</div>
            <div class="menu-btn">我的存档</div>
            <div class="menu-btn" id="role-btn">角色选择</div>
            <div class="menu-btn">问题反馈</div>
        </div>
        <img class="kanban-girl"
             src="./image/看板娘/看板娘_small.webp"
             data-hover-src="./image/看板娘/点击触发.png"
             data-default-src="./image/看板娘/看板娘_small.webp"
             alt="看板娘">
        <!-- 游戏场景：默认隐藏，由 JS 控制显示/隐藏 -->
        <div class="game-scene" style="display:none">
            <img class="game-bg" alt="游戏背景">
            <div class="game-sprite-wrap"><img class="game-sprite" alt="角色立绘"></div>
            <div class="game-dialog">
                <div class="game-name"></div>
                <div class="game-chat-history"></div>
                <div class="game-input-bar">
                    <input class="game-input" type="text" placeholder="输入你的话，回车发送...">
                    <button class="game-send">发送</button>
                </div>
            </div>
            <div class="game-exit">返回菜单</div>
        </div>

        <script>
/* ===== 以下为 style.js 完整内联副本（备份快照，改动请以主程序为准） ===== */
// 看板娘：鼠标悬停替换图片
document.addEventListener('DOMContentLoaded', () => {
    const girl = document.querySelector('.kanban-girl');
    if (!girl) return;
    const defaultSrc = girl.dataset.defaultSrc || girl.src;
    const hoverSrc   = girl.dataset.hoverSrc;
    if (!hoverSrc) return;
    const preloader = new Image();
    preloader.src = hoverSrc;
    girl.addEventListener('mouseenter', () => { girl.src = hoverSrc; });
    girl.addEventListener('mouseleave', () => { girl.src = defaultSrc; });
});

// 页面自适应：按 1920x1080 设计稿等比缩放
const PAGE_ZOOM = 1.5; // 所有元素统一放大倍数（贴边角为基准，向页面中心方向膨胀）
function fitPageScale() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * PAGE_ZOOM;
    document.documentElement.style.setProperty('--fit', s);
}
window.addEventListener('resize', fitPageScale);
fitPageScale();

let dirHandle = null;
let currentRole = null;
try {
    currentRole = localStorage.getItem('currentRole');
} catch (e) { }

document.getElementById('role-btn').addEventListener('click', openRolePanel);
document.getElementById('start-btn').addEventListener('click', openGamePanel);

function openRolePanel() {
    if (document.querySelector('.role-mask')) return;
    const mask = document.createElement('div');
    mask.className = 'role-mask';
    mask.innerHTML = `
        <div class="role-panel">
            <div class="role-head">
                <span class="role-title">角色选择</span>
                <span class="role-close" title="关闭">×</span>
            </div>
            <div class="role-grid"></div>
            <div class="role-foot"></div>
        </div>`;
    document.body.appendChild(mask);
    mask.querySelector('.role-close').addEventListener('click', () => mask.remove());
    mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
    updateRoleFoot(mask);
    loadRoles(mask.querySelector('.role-grid'));
}

async function loadRoles(grid) {
    grid.innerHTML = '<div class="role-tip">正在读取角色素材...</div>';
    let roles;
    if (dirHandle) {
        roles = await listFromHandle(dirHandle);
    } else {
        roles = await listFromFetch();
        if (roles === null && Array.isArray(window.ROLE_LIST)) {
            roles = window.ROLE_LIST;
        }
    }
    grid.innerHTML = '';
    if (roles === null) {
        addPickFolderCard(grid);
        addNewRoleCard(grid);
        return;
    }
    if (roles.length === 0) {
        grid.innerHTML = '<div class="role-tip">角色素材里还没有角色文件夹</div>';
    }
    for (const role of roles) await addRoleCard(grid, role);
    addNewRoleCard(grid);
}

async function listFromHandle(handle) {
    const roles = [];
    for await (const entry of handle.values()) {
        if (entry.kind !== 'directory') continue;
        const cover = await findCoverInDir(entry);
        roles.push({ name: entry.name, cover });
    }
    return roles;
}

async function findCoverInDir(handle) {
    for await (const entry of handle.values()) {
        if (entry.kind === 'file' && /\.(png|jpe?g|gif|webp|bmp)$/i.test(entry.name)) {
            return await entry.getFile();
        }
    }
    return null;
}

async function listFromFetch() {
    try {
        const res = await fetch('./角色素材/');
        if (!res.ok) return null;
        const html = await res.text();
        const dirs = parseListing(html).dirs;
        const roles = [];
        for (const dir of dirs) {
            let cover = null;
            try {
                const sub = await fetch('./角色素材/' + encodeURIComponent(dir) + '/');
                if (sub.ok) {
                    const imgs = parseListing(await sub.text()).files
                        .filter(f => /\.(png|jpe?g|gif|webp|bmp)$/i.test(f));
                    if (imgs.length) {
                        cover = './角色素材/' + encodeURIComponent(dir) + '/'
                              + encodeURIComponent(imgs[0]);
                    }
                }
            } catch { }
            roles.push({ name: dir, cover });
        }
        return roles;
    } catch {
        return null;
    }
}

function parseListing(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const files = [], dirs = [];
    for (const a of doc.querySelectorAll('a')) {
        const href = decodeURIComponent(a.getAttribute('href') || '');
        if (!href || href.startsWith('?') || href.startsWith('../')) continue;
        if (href.endsWith('/')) {
            const name = href.replace(/\/+$/, '').split('/').pop();
            if (name) dirs.push(name);
        } else {
            const name = href.split('/').pop();
            if (name) files.push(name);
        }
    }
    return { files, dirs };
}

async function addRoleCard(grid, role) {
    const card = document.createElement('div');
    card.className = 'role-card' + (role.name === currentRole ? ' selected' : '');
    if (role.cover) {
        const img = document.createElement('img');
        img.src = role.cover instanceof Blob ? URL.createObjectURL(role.cover) : role.cover;
        card.appendChild(img);
    } else {
        const ph = document.createElement('div');
        ph.className = 'role-cover-ph';
        ph.textContent = '🧑';
        card.appendChild(ph);
    }
    const label = document.createElement('div');
    label.className = 'role-name';
    label.textContent = role.name;
    card.appendChild(label);
    card.addEventListener('click', () => {
        currentRole = role.name;
        try {
            localStorage.setItem('currentRole', role.name);
        } catch (e) { }
        grid.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        showToast('已选择角色：' + role.name);
        updateRoleFoot(grid.closest('.role-mask'));
    });
    grid.appendChild(card);
}

function updateRoleFoot(mask) {
    if (!mask) return;
    mask.querySelector('.role-foot').textContent = '当前角色：' + (currentRole || '未选择');
}

function showToast(msg) {
    const old = document.querySelector('.role-toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'role-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

function addPickFolderCard(grid) {
    const card = document.createElement('div');
    card.className = 'role-card role-new';
    if (window.showDirectoryPicker) {
        card.textContent = '📁 选择角色素材文件夹';
        card.addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker();
            } catch {
                return;
            }
            loadRoles(grid);
        });
    } else {
        card.textContent = '当前浏览器不支持读取本地文件夹，请改用 Chrome / Edge';
        card.style.cursor = 'default';
    }
    grid.appendChild(card);
}

function addNewRoleCard(grid) {
    const card = document.createElement('div');
    card.className = 'role-card role-new';
    card.textContent = '＋ 新建角色';
    card.addEventListener('click', async () => {
        const name = (prompt('请输入新角色的名字：') || '').trim();
        if (!name) return;
        if (dirHandle) {
            try {
                await dirHandle.getDirectoryHandle(name, { create: true });
                await addRoleCard(grid, { name, cover: null });
            } catch (e) {
                alert('创建失败：' + e.message);
            }
        } else {
            await addRoleCard(grid, { name, cover: null });
        }
    });
    grid.appendChild(card);
}

let selectedBg = null;

function openGamePanel() {
    if (document.querySelector('.role-mask')) return;
    const mask = document.createElement('div');
    mask.className = 'role-mask';
    mask.innerHTML = `
        <div class="role-panel">
            <div class="role-head">
                <span class="role-title">选择游戏背景</span>
                <span class="role-close" title="关闭">×</span>
            </div>
            <div class="role-grid"></div>
            <div class="game-actions">
                <button class="game-btn cancel">取消</button>
                <button class="game-btn start" style="display:none">开始</button>
            </div>
        </div>`;
    document.body.appendChild(mask);
    mask.querySelector('.role-close').addEventListener('click', () => mask.remove());
    mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
    mask.querySelector('.game-btn.cancel').addEventListener('click', () => mask.remove());
    mask.querySelector('.game-btn.start').addEventListener('click', () => {
        if (!selectedBg) return;
        if (!currentRole) {
            showToast('请先在角色选择中选择角色');
            return;
        }
        mask.remove();
        startGame(selectedBg);
    });
    selectedBg = null;
    loadBackgrounds(mask.querySelector('.role-grid'));
}

async function loadBackgrounds(grid) {
    grid.innerHTML = '<div class="role-tip">正在读取背景素材...</div>';
    let list = Array.isArray(window.BG_LIST) ? window.BG_LIST : null;
    if (!list) {
        try {
            const res = await fetch('./image/背景图选择/');
            if (res.ok) {
                list = parseListing(await res.text()).files
                    .filter(f => /\.(png|jpe?g|gif|webp|bmp)$/i.test(f))
                    .map(f => 'image/背景图选择/' + f);
            }
        } catch { }
    }
    grid.innerHTML = '';
    if (!list || list.length === 0) {
        grid.innerHTML = '<div class="role-tip">image 文件夹里还没有背景图片</div>';
        return;
    }
    for (const path of list) addBgCard(grid, path);
}

function addBgCard(grid, path) {
    const name = path.split('/').pop().replace(/\.[^.]+$/, '');
    const card = document.createElement('div');
    card.className = 'role-card';
    const img = document.createElement('img');
    img.src = './' + path;
    img.alt = name;
    card.appendChild(img);
    const label = document.createElement('div');
    label.className = 'role-name';
    label.textContent = name;
    card.appendChild(label);
    card.addEventListener('click', () => {
        selectedBg = path;
        grid.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        card.closest('.role-panel').querySelector('.game-btn.start').style.display = '';
    });
    grid.appendChild(card);
}

function getRoleCover() {
    if (!currentRole || !Array.isArray(window.ROLE_LIST)) return null;
    const role = window.ROLE_LIST.find(r => r.name === currentRole);
    return role ? role.cover : null;
}

function startGame(bgPath) {
    const video = document.querySelector('.bg-video');
    if (video) video.style.display = 'none';
    const girl = document.querySelector('.kanban-girl');
    if (girl) girl.style.display = 'none';
    const scene = document.querySelector('.game-scene');
    if (!scene) return;
    if (!scene.dataset.bound) {
        scene.dataset.bound = '1';
        scene.querySelector('.game-exit').addEventListener('click', exitGame);
        const input = scene.querySelector('.game-input');
        const sendBtn = scene.querySelector('.game-send');
        const send = () => sendUserMessage(scene, input, sendBtn);
        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    }
    scene.querySelector('.game-bg').src = './' + bgPath;
    const sprite = scene.querySelector('.game-sprite');
    const wrap = scene.querySelector('.game-sprite-wrap');
    const cover = getRoleCover();
    if (cover) {
        sprite.src = './' + cover;
        wrap.style.display = '';
    } else {
        wrap.style.display = 'none';
    }
    scene.querySelector('.game-name').textContent = currentRole;
    scene.querySelector('.game-chat-history').innerHTML = '';
    scene.style.display = 'block';
}

function appendChatLine(scene, text, type) {
    const box = scene.querySelector('.game-chat-history');
    const line = document.createElement('div');
    line.className = 'game-chat-line ' + (type === 'user' ? 'user' : 'bot');
    line.textContent = (type === 'user' ? '你：' : '角色：') + text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
}

async function sendUserMessage(scene, input, sendBtn) {
    const userText = input.value.trim();
    if (!userText) return;
    appendChatLine(scene, userText, 'user');
    input.value = '';
    sendBtn.disabled = true;
    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_text: userText,
                role_name: currentRole,
            }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '请求失败');
        appendChatLine(scene, data.reply, 'bot');
    } catch (err) {
        appendChatLine(scene, '（后端未启动或出错）' + err.message, 'bot');
    } finally {
        sendBtn.disabled = false;
        input.focus();
    }
}

function exitGame() {
    const scene = document.querySelector('.game-scene');
    if (scene) scene.style.display = 'none';
    const video = document.querySelector('.bg-video');
    if (video) video.style.display = '';
    const girl = document.querySelector('.kanban-girl');
    if (girl) girl.style.display = '';
}
